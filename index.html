<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Vel.gg Zombies</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #eee;
      font-family: -apple-system, system-ui, sans-serif;
      z-index: 9999;
    }
    #boot h1 { font-size: 1.4rem; margin-bottom: 8px; }
    #boot p { color: #888; font-size: 0.9rem; margin-bottom: 24px; }
    #boot button {
      background: #c41e3a;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 1.05rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="boot">
    <h1>Vel.gg</h1>
    <p>BO1 Zombies · Mobile Controller</p>
    <button id="startBtn">Launch Game</button>
  </div>

  <!-- Overlay is injected by controller.js after the game page is ready -->
  <script src="controller.js"></script>
  <script>
    // In a real Capacitor app the WebView usually loads vel.gg directly
    // via capacitor.config.ts server.url. This page is a fallback / bootstrap.
    document.getElementById('startBtn').addEventListener('click', () => {
      window.location.href = 'https://vel.gg';
    });

    // If we are already on vel.gg (injected case), hide boot immediately
    if (location.hostname.includes('vel.gg')) {
      document.getElementById('boot').style.display = 'none';
      if (window.VelController) window.VelController.init();
    }
  </script>
</body>
</html>
